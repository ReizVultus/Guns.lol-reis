<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#E24B4A;--accent:#ff5f57;--accent2:#ff8a5c;--bg:#0a0a0a;--card:rgba(18,18,18,.75);--border:rgba(255,255,255,.08);--text:#fff;--text2:rgba(255,255,255,.55);--ease:cubic-bezier(.22,1,.36,1)}
html,body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;position:relative}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:9999;background-color:#000;background-size:cover;background-position:center;background-repeat:no-repeat;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;font:inherit;color:inherit;appearance:none;-webkit-appearance:none;transition:opacity .9s ease,visibility .9s ease}
#splash::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,0,0,.62) 0%,rgba(10,5,5,.50) 50%,rgba(0,0,0,.72) 100%);z-index:1}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:.65;filter:saturate(1.15);pointer-events:none;transition:transform 1.2s var(--ease)}
.splash-glass{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:1.5rem;padding:3rem 4rem;background:rgba(10,10,10,.32);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(226,75,74,.22);border-radius:20px;overflow:hidden;animation:glassGlow 4s ease-in-out infinite;transition:transform .35s var(--ease),border-color .35s var(--ease),background-color .35s var(--ease)}
.splash-glass::after{content:'';position:absolute;top:0;left:-80%;width:45%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-20deg);transition:left .9s var(--ease);pointer-events:none}
.splash-logo{font-family:'Inter',sans-serif;font-size:clamp(3rem,10vw,5.5rem);color:#fff;letter-spacing:4px;line-height:1;font-weight:700;text-shadow:0 2px 32px rgba(226,75,74,.5);opacity:0;animation:splashFade 1s .3s forwards;transition:text-shadow .35s var(--ease)}
.splash-logo .letter{display:inline-block;transition:transform .3s var(--ease)}
.splash-logo span{color:var(--red)}
.splash-divider{width:48px;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:0;animation:splashFade .8s .8s forwards;transition:width .35s var(--ease)}
.splash-text{font-family:'Inter',sans-serif;font-size:clamp(.8rem,2vw,1rem);letter-spacing:.4em;color:rgba(255,255,255,.50);font-weight:300;user-select:none;opacity:0;animation:splashFade 1.8s .6s forwards;transition:color .35s var(--ease),letter-spacing .35s var(--ease)}
.splash-text .splash-enter{color:var(--red);font-weight:400;letter-spacing:.4em;position:relative}
.splash-text .splash-enter::after{content:'';position:absolute;bottom:-3px;left:0;width:0;height:1px;background:var(--red);animation:underlineGrow 1.2s 1.8s forwards}
.splash-glass:hover{transform:scale(1.03);border-color:rgba(255,77,77,.6);background-color:rgba(28,8,10,.45)}
.splash-glass:hover::after{left:130%}
.splash-glass:hover .splash-logo{text-shadow:0 2px 38px rgba(226,75,74,.8)}
.splash-glass:hover .letter{transform:translateY(-6px)}
.splash-glass:hover .letter:nth-child(2){transition-delay:70ms}
.splash-glass:hover .letter:nth-child(3){transition-delay:140ms}
.splash-glass:hover .letter:nth-child(4){transition-delay:210ms}
.splash-glass:hover .splash-divider{width:80px}
.splash-glass:hover .splash-text{color:rgba(255,255,255,.8);letter-spacing:.44em}
.splash-glass:hover .splash-enter::after{animation:underlinePulse 1.6s ease-in-out infinite}
#splash:hover .splash-video{transform:scale(1.05)}
@keyframes underlinePulse{0%,100%{width:100%;opacity:1}50%{width:80%;opacity:.7}}
@keyframes splashFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes underlineGrow{to{width:100%}}

/* MAIN */
.main-content{display:none;min-height:100vh;align-items:center;justify-content:center}
.main-content.show{display:flex}
.bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:.42;filter:saturate(1.15);pointer-events:none}
.bg-overlay{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 30%,rgba(72,14,20,.30) 0%,rgba(9,4,11,.94) 100%)}
.bg-particles{position:fixed;inset:0;z-index:2;pointer-events:none}
.bg-glow{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at 50% 32%,rgba(226,75,74,.12),transparent 55%)}

.profile{position:relative;z-index:10;width:100%;max-width:440px;padding:2.4rem 2rem;display:flex;flex-direction:column;align-items:center;gap:1.4rem;background:linear-gradient(180deg,#331416,#1e0f12 72%);border:1px solid rgba(255,255,255,.07);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05)}
.views{position:absolute;top:14px;right:16px;display:flex;align-items:center;gap:.35rem;font-size:.72rem;color:var(--text2);letter-spacing:.5px;font-variant-numeric:tabular-nums}

.avatar-wrap{position:relative;animation:avatarFloat 6s ease-in-out infinite}
.avatar{width:120px;height:120px;border-radius:50%;border:0;padding:3px;background:linear-gradient(135deg,#ff8a5c,#E24B4A 45%,#b3253f);object-fit:cover;display:block;box-shadow:0 0 30px rgba(226,75,74,.35),0 0 60px rgba(226,75,74,.18);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.avatar:hover{transform:scale(1.04);box-shadow:0 0 40px rgba(226,75,74,.45),0 0 80px rgba(226,75,74,.2)}
.avatar-pulse{position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(226,75,74,.25);animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.15);opacity:0}}

.name{font-size:1.8rem;font-weight:700;letter-spacing:-.5px;text-align:center}
.name span{background:linear-gradient(135deg,#ff8a5c,#E24B4A 45%,#ff4d6d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}

.status{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--text2)}
.status-dot{width:8px;height:8px;border-radius:50%;background:#23d160;box-shadow:0 0 6px #23d160;animation:dotPulse 2s ease-in-out infinite}
.activity{font-size:.78rem;color:var(--text2);text-align:center;max-width:360px;line-height:1.5}

.bio{font-size:.9rem;color:var(--text2);text-align:center;line-height:1.7;max-width:360px}
.badges{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.badge{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .75rem;border-radius:20px;font-size:.72rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;border:1px solid;backdrop-filter:blur(8px);cursor:default;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.badge:hover{transform:translateY(-2px) scale(1.05)}
.badge-dev{background:rgba(88,166,255,.1);border-color:rgba(88,166,255,.3);color:#58a6ff}
.badge-dev:hover{box-shadow:0 4px 18px rgba(88,166,255,.28)}
.badge-valorant{background:rgba(226,75,74,.1);border-color:rgba(226,75,74,.3);color:#ff5f57}
.badge-valorant:hover{box-shadow:0 4px 18px rgba(226,75,74,.28)}

.links{display:flex;flex-wrap:wrap;justify-content:center;gap:1.15rem;width:100%;max-width:340px}
.link-btn{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:transparent;border:0;color:rgba(255,255,255,.7);text-decoration:none;font-size:1.5rem;line-height:1;transition:color .3s var(--ease),transform .3s var(--ease),text-shadow .3s var(--ease);cursor:pointer}
.link-btn:hover{color:#fff;transform:translateY(-3px) scale(1.12);text-shadow:0 0 18px rgba(255,255,255,.35)}
.link-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.music-card{display:flex;align-items:center;gap:.9rem;width:100%;max-width:340px;padding:.85rem .95rem;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.music-cover{width:58px;height:58px;border-radius:10px;object-fit:cover;flex-shrink:0;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.music-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:.28rem}
.music-title{font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-time{font-size:.68rem;color:var(--text2);font-variant-numeric:tabular-nums}
.music-bar{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.12);cursor:pointer;position:relative}
.music-bar-fill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,var(--accent2),var(--accent));position:relative}
.music-bar-fill::after{content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;background:#fff;opacity:0;transition:opacity .25s;box-shadow:0 0 8px rgba(255,255,255,.6)}
.music-bar:hover .music-bar-fill::after{opacity:1}
.music-controls{display:flex;align-items:center}
.mc-btn{width:30px;height:30px;border-radius:9px;border:0;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.78rem;line-height:1;cursor:pointer;transition:background .3s var(--ease),transform .3s var(--ease)}
.mc-btn:hover{background:rgba(255,255,255,.18);transform:scale(1.06)}
.mc-play{width:38px;height:38px;background:linear-gradient(135deg,var(--accent2),var(--accent));font-size:.95rem;box-shadow:0 4px 16px rgba(226,75,74,.35)}
.mc-play:hover{background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 4px 22px rgba(226,75,74,.5)}
.music-cover-wrap{position:relative;flex-shrink:0}
.eq{position:absolute;bottom:5px;right:5px;display:none;gap:2px;align-items:flex-end;height:12px;padding:3px 4px;background:rgba(0,0,0,.55);border-radius:5px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.eq.on{display:flex}
.eq span{width:3px;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:1px;animation:eqBar .9s ease-in-out infinite}
.eq span:nth-child(2){animation-delay:.12s}
.eq span:nth-child(3){animation-delay:.24s}
.eq span:nth-child(4){animation-delay:.36s}
@keyframes eqBar{0%,100%{height:3px}50%{height:11px}}

.footer-text{font-size:.72rem;color:var(--text2);opacity:.5;text-align:center;margin-top:.5rem}

@keyframes glassGlow{0%,100%{box-shadow:0 8px 56px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.05) inset,0 0 80px rgba(226,75,74,.06)}50%{box-shadow:0 8px 64px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.05) inset,0 0 130px rgba(226,75,74,.18)}}
@keyframes avatarFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes dotPulse{0%,100%{opacity:1;box-shadow:0 0 6px #23d160}50%{opacity:.45;box-shadow:0 0 14px #23d160}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* Entrada escalonada do perfil ao entrar no site */
.main-content.show .avatar-wrap{animation:riseIn .9s var(--ease) both,avatarFloat 6s ease-in-out 1.2s infinite}
.main-content.show .profile>div:nth-of-type(2){animation:riseIn .9s var(--ease) .12s both}
.main-content.show .profile>div:nth-of-type(3){animation:riseIn .9s var(--ease) .22s both}
.main-content.show .profile>div:nth-of-type(4){animation:riseIn .9s var(--ease) .32s both}
.main-content.show .links{animation:riseIn .9s var(--ease) .42s both}
.main-content.show .profile>div:nth-of-type(5){animation:riseIn .9s var(--ease) .52s both}
.main-content.show .footer-text{animation:riseIn .9s var(--ease) .62s both}

@media(max-width:480px){
  .profile{padding:1.5rem 1rem}
  .avatar{width:100px;height:100px}
  .name{font-size:1.5rem}
  .splash-glass{padding:2rem 1.5rem !important}
}

/* Acessibilidade: respeita quem prefere menos movimento */
@media (prefers-reduced-motion: reduce){
  .avatar-pulse,.status-dot,.splash-glass,.avatar-wrap{animation:none !important}
  .splash-logo,.splash-divider,.splash-text{animation:none;opacity:1}
  .splash-text .splash-enter::after{animation:none;width:100%}
  .avatar,.link-btn,.link-btn i,.splash-glass,.splash-video,.splash-logo,.splash-text,.splash-divider,.splash-glass::after,.splash-logo .letter,.mc-btn,.badge{transition:none}
  #splash:hover .splash-glass,#splash:hover .splash-video,.splash-glass:hover .letter,.badge:hover{transform:none}
  .eq span{animation:none}
  .splash-glass:hover .splash-enter::after{animation:none;width:100%}
}
</style>
</head>

<!-- Audio fora da area oculta: garante que a duracao carrega (display:none impede o navegador de carregar a midia) -->

<script src="https://cdn.jsdelivr.net/npm/counterapi/dist/counter.browser.min.js"></script>
<script>
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

// =============================================
// Arquivos reais (atenção aos espaços -> %20 nos nomes)
const BG_VIDEO_URL  = 'Banner%20Background.mp4';
const AVATAR_VIDEO_URL = 'Pfp.mp4';
// =============================================

document.getElementById('bgVideo').src = BG_VIDEO_URL;
document.getElementById('avatarVideo').src = AVATAR_VIDEO_URL;
document.getElementById('splashVideo').src = BG_VIDEO_URL;

let entered = false;

function enterSite() {
  document.getElementById('splash').classList.add('hide');
  document.getElementById('mainContent').classList.add('show');
  document.getElementById('splashVideo').pause();
  if (audio.paused) tryPlay();
  entered = true;
  resumeParticles();
}

// Fallback do avatar: se o vídeo não carregar, mostra um "R" estilizado
function avatarFallback(video) {
  const img = document.createElement('img');
  img.className = 'avatar';
  img.alt = 'Reis';
  img.src = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' fill='%23222'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' fill='%23E24B4A' font-size='42' font-family='sans-serif' font-weight='bold'>R</text></svg>";
  video.replaceWith(img);
}

// Particles (só rodam depois que o usuário entra e com a aba visível)
const canvas = document.getElementById('particles'), ctx = canvas.getContext('2d');
let W, H, parts = [], paused = true, rafId = null;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight }
resize(); addEventListener('resize', resize);
function P() {
  this.x = Math.random() * W; this.y = Math.random() * H;
  this.vx = (Math.random() - .5) * .3; this.vy = (Math.random() - .5) * .3;
  this.r = Math.random() * 1.5 + .3; this.a = Math.random() * .4 + .05;
}
for (let i = 0; i < 60; i++) parts.push(new P);
function drawParticles() {
  ctx.clearRect(0, 0, W, H);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > W) p.vx *= -1;
    if (p.y < 0 || p.y > H) p.vy *= -1;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(226,75,74,${p.a})`; ctx.fill();
  });
  parts.forEach((a, i) => {
    parts.slice(i + 1).forEach(b => {
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 100) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(226,75,74,${.08 * (1 - d / 100)})`;
        ctx.lineWidth = .4;
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    });
  });
}
function loop() {
  if (paused) return;
  drawParticles();
  rafId = requestAnimationFrame(loop);
}
function pauseParticles() {
  paused = true;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
}
function resumeParticles() {
  if (!paused || !entered || document.hidden || REDUCED_MOTION) return;
  paused = false;
  loop();
}
document.addEventListener('visibilitychange', () => {
  document.hidden ? pauseParticles() : resumeParticles();
});

// Title animation (desativada com reduced motion)
const origTitle = document.title; let ti = 0, td = false;
if (!REDUCED_MOTION) {
  (function titleLoop() {
    if (!td) { document.title = origTitle.slice(0, ti + 1); ti++; if (ti === origTitle.length) { td = true; setTimeout(titleLoop, 2000); return; } }
    else { document.title = origTitle.slice(0, ti - 1); ti--; if (ti === 0) { td = false; setTimeout(titleLoop, 300); return; } }
    setTimeout(titleLoop, td ? 50 : 80);
  })();
}

// Music player
const audio = document.getElementById('audioPlayer');
const playBtn = document.getElementById('btnPlay');
const musicBar = document.getElementById('musicBar');
const musicFill = document.getElementById('musicFill');
const timeCur = document.getElementById('timeCur');
const timeDur = document.getElementById('timeDur');

function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}
function updateDuration() {
  if (audio.duration && isFinite(audio.duration)) timeDur.textContent = fmtTime(audio.duration);
}
audio.addEventListener('loadedmetadata', updateDuration);
audio.addEventListener('durationchange', updateDuration);
audio.addEventListener('timeupdate', () => {
  timeCur.textContent = fmtTime(audio.currentTime);
  updateDuration();
  musicFill.style.width = (audio.duration ? (audio.currentTime / audio.duration) * 100 : 0) + '%';
});
audio.volume = 0.35;
function tryPlay() { audio.play().catch(() => {}); }
tryPlay();
const eqEl = document.getElementById('eq');
audio.addEventListener('ended', () => { playBtn.innerHTML = '<i class="bi bi-play-fill"></i>'; eqEl.classList.remove('on'); });
playBtn.addEventListener('click', () => {
  if (audio.paused) audio.play(); else audio.pause();
});
audio.addEventListener('play', () => { playBtn.innerHTML = '<i class="bi bi-pause-fill"></i>'; eqEl.classList.add('on'); });
audio.addEventListener('pause', () => { playBtn.innerHTML = '<i class="bi bi-play-fill"></i>'; eqEl.classList.remove('on'); });
musicBar.addEventListener('click', e => {
  const r = musicBar.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  if (audio.duration) audio.currentTime = p * audio.duration;
});

// Contador real de visitas (CounterAPI — gratuito)
const COUNTER_WORKSPACES = ['ArthurReis', 'arthurreis', 'arthur-reis']; // ← nome do seu workspace
const COUNTER_TOKEN = 'ut_TRmL03Tq8M1psnODf8hUsuq7vmXjBBBVIai0UH8b';
const COUNTER_NAME = 'reiss-visits';
const COUNTER_OFFSET = 66; // valor a partir do qual o contador começa

const viewEl = document.getElementById('viewCount');
let currentViews = 66;
function animateViews(target) {
  const start = currentViews;
  const dur = 700;
  const t0 = performance.now();
  (function frame(t) {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    currentViews = Math.round(start + (target - start) * eased);
    if (viewEl) viewEl.textContent = currentViews.toLocaleString('pt-BR');
    if (p < 1) requestAnimationFrame(frame);
  })(t0);
}
function showViews(n) { animateViews(n); }

try {
  if (window.Counter && COUNTER_TOKEN !== 'SUA-API-KEY') {
    // Tenta cada workspace ate achar o certo; conta 1 visita por sessao do navegador
    const tryWorkspace = (i) => {
      if (i >= COUNTER_WORKSPACES.length) { showViews(COUNTER_OFFSET); return; }
      const counter = new Counter({ workspace: COUNTER_WORKSPACES[i], accessToken: COUNTER_TOKEN });
      const req = sessionStorage.getItem('reiss_counted')
        ? counter.get(COUNTER_NAME)
        : (sessionStorage.setItem('reiss_counted', '1'), counter.up(COUNTER_NAME));
      req.then(r => showViews((r && r.value != null ? r.value : 0) + COUNTER_OFFSET))
         .catch(() => tryWorkspace(i + 1));
    };
    tryWorkspace(0);
  } else {
    showViews(COUNTER_OFFSET);
  }
} catch (e) {
  showViews(COUNTER_OFFSET);
}

// Status do Discord em tempo real (Lanyard — gratuito)
// 1) Pegue seu ID numerico: Discord > Configuracoes > Avancado > Modo desenvolvedor ON,
//    depois clique direito no seu nome > "Copiar ID do usuario"
// 2) Entre no servidor do Lanyard (https://discord.gg/lanyard) para o status ficar publico
const DISCORD_USER_ID = ''; // ← seu ID numerico do Discord

const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const activityText = document.getElementById('activityText');

function setStatus(status) {
  const map = {
    online:  { c: '#23d160', t: 'online' },
    idle:    { c: '#faa61a', t: 'ausente' },
    dnd:     { c: '#f23f43', t: 'nao perturbe' },
    offline: { c: '#747f8d', t: 'offline' }
  };
  const s = map[status] || map.offline;
  if (statusDot) { statusDot.style.background = s.c; statusDot.style.boxShadow = `0 0 6px ${s.c}`; }
  if (statusText) statusText.textContent = s.t;
}

function fmtActivity(a) {
  if (!a) return '';
  if (a.type === 0) return 'jogando ' + a.name;
  if (a.type === 1) return 'transmitindo ' + a.name;
  if (a.type === 2) return 'ouvindo ' + a.name;
  if (a.type === 3) return 'assistindo ' + a.name;
  return a.name;
}

function updateDiscord() {
  if (!DISCORD_USER_ID) return;
  fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`)
    .then(r => r.json())
    .then(d => {
      if (!d || !d.success || !d.data) return;
      const data = d.data;
      setStatus(data.discord_status);
      if (data.listening_to_spotify && data.spotify) {
        if (activityText) activityText.textContent = '🎵 ouvindo ' + data.spotify.song + ' — ' + data.spotify.artist;
      } else {
        const act = (data.activities || []).find(a => a.type !== 4);
        if (activityText) activityText.textContent = act ? fmtActivity(act) : '';
      }
    })
    .catch(() => {});
}
updateDiscord();
setInterval(updateDiscord, 30000);
</script>
